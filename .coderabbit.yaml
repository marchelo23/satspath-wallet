# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: "Rigorous security auditor and Bitcoin/TypeScript engineer. Audit for cryptographic safety (secp256k1/Schnorr), SSRF/DNS rebinding, fee estimation DoS, key handling, and wallet state consistency."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  tools:
    ast-grep:
      enabled: true
    eslint:
      enabled: true
    shellcheck:
      enabled: true

chat:
  auto_reply: true
