name: Deploy Wallet to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'wallet/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./wallet
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build worker bundle
        working-directory: ./wallet
        run: pnpm run build:worker

      - name: Generate git info
        working-directory: ./wallet
        run: pnpm run git-info

      - name: Build Wallet
        working-directory: ./wallet
        env:
          VITE_SATSPATH_URL: "https://satspath-wallet-production-d55f.up.railway.app"
          VITE_SATSPATH_API: "https://satspath-wallet-production-d55f.up.railway.app"
          VITE_NETWORK: "testnet"
          VITE_ARK_SERVER: "https://mutinynet.arkade.sh"
          VITE_BASE_URL: "/satspath-wallet/"
        run: pnpm exec vite build --base=/satspath-wallet/

      - name: Prepare SPA for GitHub Pages
        run: |
          touch wallet/dist/.nojekyll
          cp wallet/dist/index.html wallet/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './wallet/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
