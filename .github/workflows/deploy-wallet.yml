name: Deploy Wallet to GitHub Pages

on:
  push:
    branches: [ satspath-clean-start ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.25.0

    - name: Install dependencies
      working-directory: wallet
      run: pnpm install --no-frozen-lockfile --ignore-scripts

    - name: Build wallet
      working-directory: wallet
      run: pnpm run build
      env:
        VITE_SATSPATH_URL: https://jackson-bend-segments-melbourne.trycloudflare.com
        VITE_ARK_SERVER: https://mutinynet.arkade.sh

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: wallet/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
