services:
  wallet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ARK_SERVER: ${VITE_ARK_SERVER:-https://arkade.computer}
        VITE_NOSTR_RELAY_URL: ${VITE_NOSTR_RELAY_URL:-wss://relay.damus.io}
        VITE_APP_VERSION: "0.1.0"
    image: satspath-wallet:latest
    container_name: satspath-wallet
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      - VITE_ARK_SERVER=${VITE_ARK_SERVER:-https://arkade.computer}
      - VITE_NOSTR_RELAY_URL=${VITE_NOSTR_RELAY_URL:-wss://relay.damus.io}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
